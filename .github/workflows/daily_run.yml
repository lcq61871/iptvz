name: Auto Merge Streams Daily

on:
  schedule:
    # 北京时间凌晨 02:00 对应 UTC 时间前一天 18:00
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持在 GitHub 页面手动触发运行

jobs:
  run-hbsxzb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute hbsxzb.py
        run: python hbsxzb.py

      - name: Commit and push generated 903.txt
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add 903.txt
          git commit -m "Auto update 903.txt" || echo "No changes to commit"
          git push